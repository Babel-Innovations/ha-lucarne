add_task:
  name: Add Task
  description: Add a task to a family member's or household todo list.
  fields:
    member:
      name: Member
      description: Family member slug, or "household" for the shared list.
      required: true
      selector:
        text:
    summary:
      name: Summary
      description: Task title (max 200 characters).
      required: true
      selector:
        text:
    type:
      name: Type
      description: Task type.
      default: chore
      selector:
        select:
          options:
            - value: routine
              label: Routine
            - value: chore
              label: Chore
            - value: rotating
              label: Rotating
    recurrence:
      name: Recurrence
      description: >-
        RRULE string (e.g. FREQ=WEEKLY;BYDAY=MO,WE,FR), optionally preceded by
        a DTSTART:YYYYMMDD line to pick which fortnight an interval rule lands on.
        Leave empty for a one-off task.
      selector:
        text:
          multiline: true
    icon:
      name: Icon
      description: Single emoji icon.
      selector:
        text:
    due:
      name: Due
      description: Optional due date/time.
      selector:
        datetime:
    source:
      name: Source
      description: Creation source (default "manual").
      default: manual
      selector:
        text:
    assignee:
      name: Assignee
      description: Member slug to assign (household tasks only).
      selector:
        text:
    time_of_day:
      name: Time of day
      description: Bucket the task into a part of the day. Default is "anytime".
      default: anytime
      selector:
        select:
          options:
            - value: anytime
              label: Anytime
            - value: morning
              label: Morning
            - value: afternoon
              label: Afternoon
            - value: night
              label: Night
    rotation_owners:
      name: Rotation owners
      description: >-
        Ordered list of member slugs for rotating tasks (type=rotating only).
        Minimum 2 unique known slugs. Duplicates are removed, preserving order.
      selector:
        object:
    current_owner:
      name: Current owner
      description: >-
        Member slug whose turn it is (rotating tasks only). Defaults to the
        first entry in rotation_owners when not provided.
      selector:
        text:
    points:
      name: Points
      description: >-
        Points earned when the task is completed (0-1000). Requires an HA
        administrator, or a call with no user (automation or script).
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box

update_task_metadata:
  name: Update Task Metadata
  description: Update metadata fields on an existing task.
  fields:
    uid:
      name: UID
      description: The task's unique identifier.
      required: true
      selector:
        text:
    icon:
      name: Icon
      description: New emoji icon.
      selector:
        text:
    recurrence:
      name: Recurrence
      description: New RRULE string, optionally preceded by a DTSTART:YYYYMMDD line.
      selector:
        text:
          multiline: true
    type:
      name: Type
      description: New task type.
      selector:
        select:
          options:
            - value: routine
              label: Routine
            - value: chore
              label: Chore
            - value: rotating
              label: Rotating
    assignee:
      name: Assignee
      description: New assignee member slug (household tasks only).
      selector:
        text:
    time_of_day:
      name: Time of day
      description: New time-of-day bucket for the task.
      selector:
        select:
          options:
            - value: anytime
              label: Anytime
            - value: morning
              label: Morning
            - value: afternoon
              label: Afternoon
            - value: night
              label: Night
    rotation_owners:
      name: Rotation owners
      description: >-
        New ordered list of member slugs for a rotating task. At least 1 slug;
        current_owner must remain in the list.
      selector:
        object:
    current_owner:
      name: Current owner
      description: New current owner slug for a rotating task. Must be in rotation_owners.
      selector:
        text:
    points:
      name: Points
      description: >-
        Points earned when the task is completed (0-1000). Requires an HA
        administrator, or a call with no user (automation or script).
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box

delete_task:
  name: Delete Task
  description: Delete a task and its metadata. Completion log rows are preserved.
  fields:
    uid:
      name: UID
      description: The task's unique identifier.
      required: true
      selector:
        text:

toggle_task:
  name: Toggle Task
  description: Toggle a task's completion status and append a completion log entry.
  fields:
    uid:
      name: UID
      description: The task's unique identifier.
      required: true
      selector:
        text:

perform_daily_reset:
  name: Perform Daily Reset
  description: Reset all completed routine items back to needs_action for every member, append reset rows to the completion log, and clean up task metadata left behind when a task was deleted outside Lucarne (for example from Home Assistant's own to-do panel). Called by the managed time-change listener at the configured reset_time.
  fields: {}

evaluate_all_streaks:
  name: Evaluate All Streaks
  description: Recompute each member's streak from the completion log and update the counter mirror. Called by the managed time-change listener at the configured streak_check_time.
  fields: {}

upload_avatar:
  name: Upload Avatar
  description: Upload a member's avatar image.
  fields:
    member:
      name: Member
      description: Family member slug.
      required: true
      selector:
        text:
    image_data:
      name: Image Data
      description: Base64-encoded image bytes.
      required: true
      selector:
        text:
    mime_type:
      name: MIME Type
      description: Image MIME type.
      required: true
      selector:
        select:
          options:
            - value: image/png
              label: PNG
            - value: image/jpeg
              label: JPEG
            - value: image/webp
              label: WebP

set_member_avatar:
  name: Set Member Avatar
  description: Set a member's avatar to an emoji or an uploaded image path.
  fields:
    member:
      name: Member
      description: Family member slug.
      required: true
      selector:
        text:
    avatar:
      name: Avatar
      description: >-
        An emoji or emoji sequence (e.g. 🧒, ❤️, 👨‍👩‍👧‍👦) or a
        /local/lucarne/avatars/<filename> path from a prior upload_avatar call.
        Invisible-only strings (bare ZWJ, bare variation-selector) are rejected.
      required: true
      selector:
        text:

grant_points:
  name: Grant Points
  description: Give a member bonus points. Requires an HA administrator, or a call with no user.
  fields:
    member:
      name: Member
      description: Family member slug.
      required: true
      selector:
        text:
    points:
      name: Points
      description: Points to grant (1-10000).
      required: true
      selector:
        number:
          min: 1
          max: 10000
          step: 1
          mode: box
    reason:
      name: Reason
      description: Optional note shown in the history (max 200 characters).
      selector:
        text:

create_reward:
  name: Create Reward
  description: Add a reward to the catalog. Requires an HA administrator, or a call with no user.
  fields:
    name:
      name: Name
      description: Reward name (1-60 characters).
      required: true
      selector:
        text:
    cost:
      name: Cost
      description: Cost in points (1-100000).
      required: true
      selector:
        number:
          min: 1
          max: 100000
          step: 1
          mode: box
    description:
      name: Description
      description: Optional text (max 500 characters).
      selector:
        text:
    poolable:
      name: Poolable
      description: Whether several members can pool points for it.
      default: false
      selector:
        boolean:

update_reward:
  name: Update Reward
  description: Change an active reward. Existing claims keep their snapshot. Requires an HA administrator, or a call with no user.
  fields:
    reward_id:
      name: Reward ID
      description: Id of the reward.
      required: true
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Name
      description: Reward name (1-60 characters).
      selector:
        text:
    cost:
      name: Cost
      description: Cost in points (1-100000).
      selector:
        number:
          min: 1
          max: 100000
          step: 1
          mode: box
    description:
      name: Description
      description: Text (max 500 characters).
      selector:
        text:
    poolable:
      name: Poolable
      description: Whether several members can pool points for it.
      selector:
        boolean:

archive_reward:
  name: Archive Reward
  description: Hide a reward from the catalog. Pending claims on it can still be resolved. Requires an HA administrator, or a call with no user.
  fields:
    reward_id:
      name: Reward ID
      description: Id of the reward.
      required: true
      selector:
        number:
          min: 1
          mode: box

set_rewards_settings:
  name: Set Rewards Settings
  description: Set the family-wide streak bonuses. Omitted fields stay unchanged. Requires an HA administrator, or a call with no user.
  fields:
    streak_daily_bonus:
      name: Daily streak bonus
      description: Points for every day the streak counts (0 disables it).
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          mode: box
    streak_milestones:
      name: Streak milestones
      description: List of {days, points}; each pays once when the streak crosses it.
      selector:
        object:

claim_reward:
  name: Claim Reward
  description: Reserve the points for a reward, alone or pooled with other members. A parent approves or rejects it afterwards.
  fields:
    member:
      name: Member
      description: Family member slug of the claimer.
      required: true
      selector:
        text:
    reward_id:
      name: Reward ID
      description: Id of the reward.
      required: true
      selector:
        number:
          min: 1
          mode: box
    pool_with:
      name: Pool with
      description: Other member slugs sharing the cost (poolable rewards only).
      selector:
        text:
          multiple: true

cancel_claim:
  name: Cancel Claim
  description: Cancel a pending claim and give the points back.
  fields:
    claim_id:
      name: Claim ID
      description: Id of the claim.
      required: true
      selector:
        number:
          min: 1
          mode: box

approve_claim:
  name: Approve Claim
  description: Approve a pending claim; the reserved points become spent. Requires an HA administrator, or a call with no user.
  fields:
    claim_id:
      name: Claim ID
      description: Id of the claim.
      required: true
      selector:
        number:
          min: 1
          mode: box

reject_claim:
  name: Reject Claim
  description: Reject a pending claim and give the points back. Requires an HA administrator, or a call with no user.
  fields:
    claim_id:
      name: Claim ID
      description: Id of the claim.
      required: true
      selector:
        number:
          min: 1
          mode: box

refund_claim:
  name: Refund Claim
  description: Refund an approved claim and give the points back. Requires an HA administrator, or a call with no user.
  fields:
    claim_id:
      name: Claim ID
      description: Id of the claim.
      required: true
      selector:
        number:
          min: 1
          mode: box
