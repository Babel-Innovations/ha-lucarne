[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lucarne_family"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    # phccc and ical are pinned exactly and move as a UNIT — never bump one alone.
    # phccc pins homeassistant exactly (0.13.356 -> HA 2026.8.2), and ical must
    # equal that HA's homeassistant/components/local_todo/manifest.json pin
    # (2026.8.2 -> ical==14.1.0). The integration drives local_todo, and phccc
    # does not install integration requirements, so a mismatch raises no resolver
    # error — it silently tests .ics parsing against a version production HA
    # never ships. A >= floor on phccc would let HA drift away from the ical pin
    # with no diff to review, which is exactly how PR #96 went wrong.
    # To bump: pick the new phccc, read the HA version it pins, then copy that
    # HA's local_todo ical pin here.
    "pytest-homeassistant-custom-component==0.13.357",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "ical==14.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
exclude = ["src*", "tests*", "dist*", "node_modules*"]

[tool.setuptools.package-data]
"custom_components.lucarne_family" = ["manifest.json", "schema.sql", "services.yaml", "translations/*.json"]

[tool.ruff]
# target-version is inferred from project.requires-python above.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["homeassistant.*", "pytest_homeassistant_custom_component.*", "dateutil.*", "yaml"]
ignore_missing_imports = true

# HA re-exports StaticPathConfig from .server via __init__ without __all__,
# which mypy strict rejects. Scope the relaxation to that one module.
[[tool.mypy.overrides]]
module = ["homeassistant.components.http"]
no_implicit_reexport = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--cov=custom_components/lucarne_family --cov-report=term-missing"
filterwarnings = [
    "error::DeprecationWarning:custom_components.lucarne_family",
]

[tool.coverage.run]
source = ["custom_components/lucarne_family"]

[tool.coverage.report]
# Statement-coverage floor, floored from the 86% baseline. coverage.py's
# fail_under is a single total, so (unlike the TS suite, where Node enforces
# line/branch/funcs separately) Python enforces its primary metric: statements.
fail_under = 86
