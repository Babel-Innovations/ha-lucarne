version: 2
updates:
  # Frontend (Lit cards) — package.json / package-lock.json
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # cropperjs 2.x is a class -> web-component rewrite; the avatar-crop UI in
    # avatar-upload-modal.ts uses the v1 API (new Cropper(...), getCroppedCanvas)
    # and migrating it needs its own spec (see CLAUDE.md). Keep cropperjs on the
    # v1 line until then; major bumps break the typecheck (see PR #46).
    ignore:
      - dependency-name: "cropperjs"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.71.x peer-requires typescript <6.1.0, so a TS 7 (or
      # 6.1) bump fails `npm ci` with ERESOLVE (see PR #141). Lift this once
      # @typescript-eslint/eslint-plugin accepts the newer range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Python integration — pyproject.toml (runtime + [dev])
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pytest and pytest-asyncio are exact-pinned by
    # pytest-homeassistant-custom-component (it mirrors HA core's test stack),
    # so they update transitively whenever phccc is bumped. Bumping either
    # directly raises the pyproject floor above phccc's pin and makes pip
    # resolution impossible (see PR #45).
    # ical must mirror homeassistant/components/local_todo/manifest.json for the
    # HA version phccc pins — not the latest release on PyPI. Dependabot cannot
    # see that constraint and bumped it to a version no HA ships (PR #96), so it
    # is ignored here. phccc is deliberately NOT ignored: its bumps are the
    # signal that HA moved, and whoever takes one must update the ical pin in
    # pyproject.toml in the same commit (see the comment on that pin).
    ignore:
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "ical"
      # HA's tree caps dateutil below 3.0 (hass-nabucasa -> pycognito -> boto3
      # -> botocore: python-dateutil<3.0.0), so a raised floor is unresolvable
      # and pip dies with resolution-too-deep (PR #172). The floor has no upper
      # cap, so CI picks up 3.x on its own once botocore lifts it; raise the
      # floor by hand only if recurrence.py needs a 3.x API.
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]

  # CI workflows under .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
