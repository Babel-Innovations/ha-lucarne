name: Hassfest Validation

on:
  push:
  pull_request:
  schedule:
    # Daily — hassfest rules change with HA core releases; catch drift early.
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin home-assistant/actions to a commit SHA, matching the SHA-pinning
      # convention used by the other workflows. Bump deliberately.
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master as of 2026-06-22
