name: Hassfest Validation

on:
  push:
  pull_request:
  schedule:
    # Daily — hassfest rules change with HA core releases; catch drift early.
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Pin home-assistant/actions to a commit SHA, matching the SHA-pinning
      # convention used by the other workflows. Bump deliberately.
      - uses: home-assistant/actions/hassfest@e91ad1948e57189485b9c1ad608af0c303946f89 # master as of 2026-05-30
