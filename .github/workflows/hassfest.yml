name: Hassfest Validation

on:
  push:
  pull_request:
  schedule:
    # Daily — hassfest rules change with HA core releases; catch drift early.
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin home-assistant/actions to a commit SHA, matching the SHA-pinning
      # convention used by the other workflows. Bump deliberately.
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master as of 2026-06-22
