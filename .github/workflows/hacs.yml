name: HACS Validation

on:
  push:
  pull_request:

jobs:
  hacs-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin hacs/action to a commit SHA — the latest tag (22.5.0) is stale
      # relative to current HACS validation rules. Bump deliberately.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main as of 2026-05-23
        with:
          category: integration
