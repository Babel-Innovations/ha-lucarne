name: HACS Validation

on:
  push:
  pull_request:

jobs:
  hacs-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Pin hacs/action to a commit SHA — the latest tag (22.5.0) is stale
      # relative to current HACS validation rules. Bump deliberately.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main as of 2026-05-23
        with:
          category: integration
