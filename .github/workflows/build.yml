name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Two runs of the same guard, covering opposite directions (issue #101).
      # This one parses the COMMITTED bundle — the exact bytes HACS ships, which
      # `npm run build` is about to overwrite.
      - name: Bundle syntax floor (committed artifact)
        run: node --import tsx --test tests/build/bundle-syntax.test.ts

      - run: npm run build

      # test:coverage re-runs the guard, now against freshly emitted output, so a
      # PR that raised or removed `build.target` without rebuilding still fails.
      # Don't move this above the build step.
      - run: npm run test:coverage

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Single source of truth: project.requires-python in pyproject.toml.
          # Resolves to the latest patch of the latest minor satisfying the
          # constraint; when bumping the floor, edit pyproject.toml only.
          python-version-file: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check custom_components tests/python conftest.py

      - run: mypy custom_components/lucarne_family

      - run: pytest
