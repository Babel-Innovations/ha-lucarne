name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Single source of truth: project.requires-python in pyproject.toml.
          # Resolves to the latest patch of the latest minor satisfying the
          # constraint; when bumping the floor, edit pyproject.toml only.
          python-version-file: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check custom_components tests/python conftest.py

      - run: mypy custom_components/lucarne_family

      - run: pytest
