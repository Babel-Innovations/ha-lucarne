name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Two runs of the same guards, covering opposite directions (issue #101).
      # These parse and load the COMMITTED bundles — the exact bytes HACS ships,
      # which `npm run build` is about to overwrite.
      - name: Bundle guards (committed artifacts)
        run: node --import tsx --test 'tests/build/*.test.ts'

      - run: npm run build

      # HACS ships the committed bytes and never builds, so a PR that changes card
      # sources without committing the rebuilt bundles ships the old cards while
      # every check passes. `npm run build` emits both files, so the realistic slip
      # is staging one of the two out of habit — and which one you dropped decides
      # which half of the users get a dashboard of Configuration error cards.
      # Nothing else in CI notices: the guards below parse whatever is on disk,
      # which is now the fresh output.
      # `git status --porcelain`, not `git diff`: it also catches an *untracked*
      # output, so a third bundle that is emitted but never `git add`-ed fails here
      # instead of silently missing from what HACS ships. Same check, same wording
      # as create-prerelease.sh. Printing the porcelain lines rather than the patch
      # keeps ~700 kB of minified diff out of the step log.
      - name: Committed bundles are up to date
        run: |
          STATUS=$(git status --porcelain -- custom_components/lucarne_family/frontend)
          if [ -n "$STATUS" ]; then
            echo "::error::Committed bundle(s) stale or missing — run 'npm run build' and commit custom_components/lucarne_family/frontend/"
            echo "$STATUS"
            exit 1
          fi

      # test:coverage re-runs the guards, now against freshly emitted output, so a
      # PR that raised or removed `build.target`, or dropped the `iife` format,
      # without rebuilding still fails.
      # Don't move this above the build step.
      - run: npm run test:coverage

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Single source of truth: project.requires-python in pyproject.toml.
          # Resolves to the latest patch of the latest minor satisfying the
          # constraint; when bumping the floor, edit pyproject.toml only.
          python-version-file: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check custom_components tests/python conftest.py

      - run: mypy custom_components/lucarne_family

      - run: pytest
